name: Private-aware profile metrics

concurrency:
  group: profile-metrics
  cancel-in-progress: true

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate repository telemetry
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ghanim01
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Cairo
          config_display: large
          repositories_affiliations: owner, collaborator, organization_member
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugin_followup: yes
          plugin_followup_sections: repositories, user

      - name: Generate private-aware language fingerprint
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ghanim01
          filename: metrics-languages.svg
          template: classic
          base: ""
          config_timezone: Africa/Cairo
          config_animations: no
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_analysis_timeout: 10
          plugin_languages_analysis_timeout_repositories: 5
